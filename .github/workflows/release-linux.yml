# Build linux-amd64 and linux-arm64 geth binaries and attach them to a
# GitHub Release. This is the official Linux path for Mars Credit miners
# (the Mac/Windows Mars Credit Miner app ships its own pinned binary).
#
# Triggers:
#   - pushing a tag matching v*  (e.g. git tag v1.10.18-mars-fast1 && git push origin v1.10.18-mars-fast1)
#   - workflow_dispatch (manual; builds artifacts but does not create a release
#     unless the run is on a tag)
#
# The release is created as a draft so a human can review checksums before
# publishing. Never tag a binary built with -tags marsdevfork.

name: Release Linux binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: geth-linux-${{ matrix.goarch }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go 1.17
        uses: actions/setup-go@v5
        with:
          go-version: "1.17.13"
          cache: true

      - name: Build
        run: ./scripts/build-linux.sh ${{ matrix.goarch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: geth-linux-${{ matrix.goarch }}
          path: |
            dist/geth-linux-${{ matrix.goarch }}
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout (for SHA256SUMS script)
        uses: actions/checkout@v4

      - name: Download linux-amd64
        uses: actions/download-artifact@v4
        with:
          name: geth-linux-amd64
          path: dist

      - name: Download linux-arm64
        uses: actions/download-artifact@v4
        with:
          name: geth-linux-arm64
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          chmod +x geth-linux-amd64 geth-linux-arm64
          sha256sum geth-linux-amd64 geth-linux-arm64 | tee SHA256SUMS
          ./geth-linux-amd64 version
          ./geth-linux-amd64 version | grep -q "1.10.18-mars-fast1"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: false
          name: Mars Credit geth ${{ github.ref_name }}
          body: |
            Linux geth binaries for Mars Credit (`1.10.18-mars-fast1`, chain 110110).

            Built from tag `${{ github.ref_name }}` (`${{ github.sha }}`) with Go 1.17.13, `CGO_ENABLED=0`.

            Confirm `geth version` prints `1.10.18-mars-fast1` before mining. See [docs/MINING.md](https://github.com/marscredit/go-marscredit/blob/mars-fast-v1/docs/MINING.md) for solo CPU/GPU setup on your own node.

            **Do not** point miners at `rpc.marscredit.xyz` or node99. **Do not** join a pool or public stratum. **Do not** expose the miner API on the public internet.

            Assets:
            - `geth-linux-amd64` / `geth-linux-arm64`
            - `SHA256SUMS`
          files: |
            dist/geth-linux-amd64
            dist/geth-linux-arm64
            dist/SHA256SUMS
